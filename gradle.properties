# Gradle Properties for Maven Central Publishing via Sonatype Central Portal
# These properties should be set in your local ~/.gradle/gradle.properties or as environment variables.
# DO NOT commit actual credentials to this file.

# Sonatype Central Portal User Tokens
# Generate at: https://central.sonatype.com > Account > Generate User Token
# ossrhUsername=your-central-portal-token-username
# ossrhPassword=your-central-portal-token-password

# In-memory GPG Signing (used by CI and local builds)
# Export your key: gpg --armor --export-secret-keys <KEY_ID>
# signingKey=<ASCII-armored GPG private key>
# signingPassword=<GPG key passphrase>

# Environment variable equivalents (used in GitHub Actions):
# OSSRH_USERNAME, OSSRH_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

org.gradle.configuration-cache=true
